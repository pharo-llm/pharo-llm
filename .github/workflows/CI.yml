name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.smalltalk }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        smalltalk:
          - Pharo64-14
          - Pharo64-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up smalltalkCI
        uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}

      - name: Run tests
        shell: bash
        run: smalltalkci -s "${{ matrix.smalltalk }}"
        timeout-minutes: 15

  build-release-p14:
    name: Build Pharo 14 image for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs:
      - test

    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    env:
      SMALLTALK_IMAGE: Pharo64-14
      DEFAULT_IMAGE_NAME: TravisCI
      RELEASE_IMAGE_NAME: Pharo-LLM-P14
      PLATFORM_ID: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout PharoInfer native source
        uses: actions/checkout@v7
        with:
          repository: pharo-llm/pharo-infer
          path: pharo-infer

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up smalltalkCI
        uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ env.SMALLTALK_IMAGE }}

      - name: Build Pharo 14 image
        shell: bash
        run: smalltalkci -s "${{ env.SMALLTALK_IMAGE }}"
        timeout-minutes: 15

      - name: Build PharoInfer native runtime
        shell: bash
        run: |
          set -euo pipefail

          rm -rf native-runtime
          INSTALL_DIR="$PWD/native-runtime/pharo-infer-native" \
            sh pharo-infer/scripts/build-native.sh

          echo "Native runtime files:"
          find native-runtime/pharo-infer-native/lib -maxdepth 2 -type f -print
        timeout-minutes: 30

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          echo "SMALLTALK_CI_BUILD=$SMALLTALK_CI_BUILD"
          echo "Files produced by smalltalkCI:"
          find "$SMALLTALK_CI_BUILD" -maxdepth 2 -type f -print

          IMAGE_FILE="${SMALLTALK_CI_IMAGE:-$SMALLTALK_CI_BUILD/$DEFAULT_IMAGE_NAME.image}"
          CHANGES_FILE="${SMALLTALK_CI_CHANGES:-$SMALLTALK_CI_BUILD/$DEFAULT_IMAGE_NAME.changes}"

          if [[ ! -f "$IMAGE_FILE" ]]; then
            IMAGE_FILE="$(
              find "$SMALLTALK_CI_BUILD" \
                -maxdepth 2 \
                -type f \
                -iname '*.image' \
                -print \
                -quit
            )"
          fi

          if [[ ! -f "$CHANGES_FILE" ]]; then
            CHANGES_FILE="$(
              find "$SMALLTALK_CI_BUILD" \
                -maxdepth 2 \
                -type f \
                -iname '*.changes' \
                -print \
                -quit
            )"
          fi

          if [[ -z "$IMAGE_FILE" || ! -f "$IMAGE_FILE" ]]; then
            echo "::error::Image file not found: $IMAGE_FILE"
            find "$SMALLTALK_CI_BUILD" -maxdepth 2 -type f -print
            exit 1
          fi

          if [[ -z "$CHANGES_FILE" || ! -f "$CHANGES_FILE" ]]; then
            echo "::error::Changes file not found: $CHANGES_FILE"
            find "$SMALLTALK_CI_BUILD" -maxdepth 2 -type f -print
            exit 1
          fi

          SOURCES_FILE="$(
            find "$SMALLTALK_CI_BUILD" \
              -maxdepth 1 \
              -type f \
              -name '*.sources' \
              -print \
              -quit
          )"

          if [[ -z "$SOURCES_FILE" ]]; then
            echo "::error::No Pharo .sources file found in $SMALLTALK_CI_BUILD"
            find "$SMALLTALK_CI_BUILD" -maxdepth 2 -type f -print
            exit 1
          fi

          SOURCES_NAME="$(basename "$SOURCES_FILE")"

          echo "Found image: $IMAGE_FILE"
          echo "Found changes: $CHANGES_FILE"
          echo "Found sources: $SOURCES_FILE"

          if [[ ! -d native-runtime/pharo-infer-native/lib ]]; then
            echo "::error::Native runtime was not produced"
            exit 1
          fi

          cp "$IMAGE_FILE" "dist/$RELEASE_IMAGE_NAME.image"
          cp "$CHANGES_FILE" "dist/$RELEASE_IMAGE_NAME.changes"
          cp "$SOURCES_FILE" "dist/$SOURCES_NAME"
          cp -R native-runtime/pharo-infer-native dist/pharo-infer-native
          find dist/pharo-infer-native/lib -type l -print | while read -r link_path; do
            cp -L "$link_path" "$link_path.resolved"
            rm "$link_path"
            mv "$link_path.resolved" "$link_path"
          done

          printf '140\n' > "dist/pharo.version"

          cd dist

          cmake -E tar cf "$RELEASE_IMAGE_NAME-$PLATFORM_ID.zip" \
            --format=zip \
            "$RELEASE_IMAGE_NAME.image" \
            "$RELEASE_IMAGE_NAME.changes" \
            "$SOURCES_NAME" \
            pharo-infer-native \
            pharo.version

          echo "Release files:"
          ls -lah

          echo "Pharo image ZIP contents:"
          cmake -E tar tf "$RELEASE_IMAGE_NAME-$PLATFORM_ID.zip"

      - name: Upload release image artifact
        uses: actions/upload-artifact@v4
        with:
          name: pharo-llm-p14-${{ matrix.platform }}
          path: |
            dist/Pharo-LLM-P14-${{ matrix.platform }}.zip
            dist/pharo.version
            dist/*.sources
          if-no-files-found: error

  release-p14:
    name: Publish Pharo 14 release assets
    runs-on: ubuntu-latest
    needs:
      - build-release-p14

    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    env:
      RELEASE_IMAGE_NAME: Pharo-LLM-P14
      RELEASE_TAG: pharo-llm-14-development
      RELEASE_TITLE: Pharo-LLM 14 (development)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release image artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pharo-llm-p14-*
          path: release-artifacts

      - name: Assemble release files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          find release-artifacts -maxdepth 2 -type f -print

          find release-artifacts \
            -maxdepth 2 \
            -type f \
            -name "$RELEASE_IMAGE_NAME-*.zip" \
            -exec cp {} dist/ \;

          for platform in linux macos windows; do
            if [[ ! -f "dist/$RELEASE_IMAGE_NAME-$platform.zip" ]]; then
              echo "::error::Missing platform ZIP: dist/$RELEASE_IMAGE_NAME-$platform.zip"
              exit 1
            fi
          done

          VERSION_FILE="$(
            find release-artifacts \
              -maxdepth 2 \
              -type f \
              -name 'pharo.version' \
              -print \
              -quit
          )"

          if [[ -z "$VERSION_FILE" ]]; then
            echo "::error::No pharo.version file found in release artifacts"
            exit 1
          fi

          cp "$VERSION_FILE" dist/pharo.version

          SOURCES_FILE="$(
            find release-artifacts \
              -maxdepth 2 \
              -type f \
              -name '*.sources' \
              -print \
              -quit
          )"

          if [[ -z "$SOURCES_FILE" ]]; then
            echo "::error::No Pharo .sources file found in release artifacts"
            exit 1
          fi

          SOURCES_NAME="$(basename "$SOURCES_FILE")"
          cp "$SOURCES_FILE" "dist/$SOURCES_NAME"

          git archive \
            --format=zip \
            --output="dist/$RELEASE_IMAGE_NAME-source.zip" \
            HEAD

          cp "dist/$RELEASE_IMAGE_NAME-macos.zip" "dist/$RELEASE_IMAGE_NAME.zip"

          echo "Release files:"
          ls -lah dist

          for archive in dist/*.zip; do
            echo "ZIP contents for $archive:"
            cmake -E tar tf "$archive" | head -100
          done

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          SOURCES_FILE="$(
            find dist \
              -maxdepth 1 \
              -type f \
              -name '*.sources' \
              -print \
              -quit
          )"

          if [[ -z "$SOURCES_FILE" ]]; then
            echo "::error::No .sources file found in dist"
            find dist -maxdepth 1 -type f -print
            exit 1
          fi

          ASSETS=(
            "dist/$RELEASE_IMAGE_NAME.zip"
            "dist/$RELEASE_IMAGE_NAME-linux.zip"
            "dist/$RELEASE_IMAGE_NAME-macos.zip"
            "dist/$RELEASE_IMAGE_NAME-windows.zip"
            "dist/$RELEASE_IMAGE_NAME-source.zip"
            "dist/pharo.version"
            "$SOURCES_FILE"
          )

          echo "Files that will be uploaded:"
          ls -lah "${ASSETS[@]}"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Updating existing release: $RELEASE_TAG"

            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes "Development build for Pharo 14 from main." \
              --prerelease

            gh release upload "$RELEASE_TAG" \
              "${ASSETS[@]}" \
              --clobber
          else
            echo "Creating release: $RELEASE_TAG"

            gh release create "$RELEASE_TAG" \
              "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "Development build for Pharo 14 from main." \
              --prerelease \
              --latest=false
          fi

          echo "Assets attached to the release:"
          gh release view "$RELEASE_TAG" \
            --json assets \
            --jq '.assets[].name'
