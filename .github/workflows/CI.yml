name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.smalltalk }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        smalltalk:
          - Pharo64-14
          - Pharo64-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up smalltalkCI
        uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}

      - name: Run tests
        shell: bash
        run: smalltalkci -s "${{ matrix.smalltalk }}"
        timeout-minutes: 15

  release-p14:
    name: Build and release Pharo 14 image
    runs-on: macos-latest
    needs:
      - test

    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    env:
      SMALLTALK_IMAGE: Pharo64-14
      DEFAULT_IMAGE_NAME: TravisCI
      RELEASE_IMAGE_NAME: Pharo-LLM-P14
      RELEASE_TAG: pharo-llm-14-development
      RELEASE_TITLE: Pharo-LLM 14 (development)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up smalltalkCI
        uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ env.SMALLTALK_IMAGE }}

      - name: Build Pharo 14 image
        shell: bash
        run: smalltalkci -s "${{ env.SMALLTALK_IMAGE }}"
        timeout-minutes: 15

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          echo "SMALLTALK_CI_BUILD=$SMALLTALK_CI_BUILD"
          echo "Files produced by smalltalkCI:"
          find "$SMALLTALK_CI_BUILD" -maxdepth 2 -type f -print

          IMAGE_FILE="$SMALLTALK_CI_BUILD/$DEFAULT_IMAGE_NAME.image"
          CHANGES_FILE="$SMALLTALK_CI_BUILD/$DEFAULT_IMAGE_NAME.changes"

          if [[ ! -f "$IMAGE_FILE" ]]; then
            echo "::error::Image file not found: $IMAGE_FILE"
            exit 1
          fi

          if [[ ! -f "$CHANGES_FILE" ]]; then
            echo "::error::Changes file not found: $CHANGES_FILE"
            exit 1
          fi

          SOURCES_FILE="$(
            find "$SMALLTALK_CI_BUILD" \
              -maxdepth 1 \
              -type f \
              -name '*.sources' \
              -print \
              -quit
          )"

          if [[ -z "$SOURCES_FILE" ]]; then
            echo "::error::No Pharo .sources file found in $SMALLTALK_CI_BUILD"
            find "$SMALLTALK_CI_BUILD" -maxdepth 2 -type f -print
            exit 1
          fi

          SOURCES_NAME="$(basename "$SOURCES_FILE")"

          echo "Found image: $IMAGE_FILE"
          echo "Found changes: $CHANGES_FILE"
          echo "Found sources: $SOURCES_FILE"

          cp "$IMAGE_FILE" \
            "dist/$RELEASE_IMAGE_NAME.image"

          cp "$CHANGES_FILE" \
            "dist/$RELEASE_IMAGE_NAME.changes"

          cp "$SOURCES_FILE" \
            "dist/$SOURCES_NAME"

          printf '140\n' > "dist/pharo.version"

          # Create a visible archive containing the repository source code.
          git archive \
            --format=zip \
            --output="dist/$RELEASE_IMAGE_NAME-source.zip" \
            HEAD

          cd dist

          zip -9 "$RELEASE_IMAGE_NAME.zip" \
            "$RELEASE_IMAGE_NAME.image" \
            "$RELEASE_IMAGE_NAME.changes" \
            "$SOURCES_NAME" \
            pharo.version

          echo "Release files:"
          ls -lah

          echo "Pharo image ZIP contents:"
          unzip -l "$RELEASE_IMAGE_NAME.zip"

          echo "Repository source ZIP contents:"
          unzip -l "$RELEASE_IMAGE_NAME-source.zip" | head -100

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          SOURCES_FILE="$(
            find dist \
              -maxdepth 1 \
              -type f \
              -name '*.sources' \
              -print \
              -quit
          )"

          if [[ -z "$SOURCES_FILE" ]]; then
            echo "::error::No .sources file found in dist"
            find dist -maxdepth 1 -type f -print
            exit 1
          fi

          echo "Files that will be uploaded:"
          ls -lah \
            "dist/$RELEASE_IMAGE_NAME.zip" \
            "dist/$RELEASE_IMAGE_NAME-source.zip" \
            "dist/pharo.version" \
            "$SOURCES_FILE"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Updating existing release: $RELEASE_TAG"

            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes "Development build for Pharo 14 from main." \
              --prerelease

            gh release upload "$RELEASE_TAG" \
              "dist/$RELEASE_IMAGE_NAME.zip" \
              "dist/$RELEASE_IMAGE_NAME-source.zip" \
              "dist/pharo.version" \
              "$SOURCES_FILE" \
              --clobber
          else
            echo "Creating release: $RELEASE_TAG"

            gh release create "$RELEASE_TAG" \
              "dist/$RELEASE_IMAGE_NAME.zip" \
              "dist/$RELEASE_IMAGE_NAME-source.zip" \
              "dist/pharo.version" \
              "$SOURCES_FILE" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "Development build for Pharo 14 from main." \
              --prerelease \
              --latest=false
          fi

          echo "Assets attached to the release:"
          gh release view "$RELEASE_TAG" \
            --json assets \
            --jq '.assets[].name'
